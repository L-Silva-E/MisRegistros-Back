version: "3.9"

services:
  # Service for production
  api-mis-registros:
    container_name: api-mis-registros
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
    ports:
      - ${API_PORT}:${API_PORT}
    networks:
      - mis-registros-network
    profiles:
      - production

  # Service for development with hot reload
  api-mis-registros-dev:
    container_name: api-mis-registros-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?schema=public
      - NODE_ENV=development
    ports:
      - ${API_PORT}:${API_PORT}
    volumes:
      - ./src:/app/src:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - /app/node_modules
    networks:
      - mis-registros-network
    profiles:
      - development
    depends_on:
      - db-mis-registros

  db-mis-registros:
    container_name: db-mis-registros
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mis-registros-network

volumes:
  pgdata:

networks:
  mis-registros-network:
    driver: bridge
